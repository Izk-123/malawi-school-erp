{% extends "registration/base_auth.html" %}
{% block title %}Change password{% endblock %}

{% block content %}
<h1 class="auth-form-title">Change password</h1>
<p class="auth-form-sub" style="margin-bottom:20px;">
    Pick something you haven't used before.
</p>

<form method="post" class="auth-form">
    {% csrf_token %}

    <div class="field">
        <label class="field-label" for="id_old_password">Current password</label>
        <div class="field-password">
            <input id="id_old_password" name="old_password" type="password"
                   class="field-input" autocomplete="current-password" autofocus required>
            <button type="button" class="field-eye"
                    data-pwd-toggle="id_old_password" aria-label="Show password">
                <i class="bi bi-eye"></i>
            </button>
        </div>
    </div>

    <div class="field">
        <label class="field-label" for="id_new_password1">New password</label>
        <div class="field-password">
            <input id="id_new_password1" name="new_password1" type="password"
                   class="field-input" autocomplete="new-password" required>
            <button type="button" class="field-eye"
                    data-pwd-toggle="id_new_password1" aria-label="Show password">
                <i class="bi bi-eye"></i>
            </button>
        </div>
        <div class="password-strength" data-strength-target="id_new_password1"></div>
    </div>

    <div class="field">
        <label class="field-label" for="id_new_password2">Confirm new password</label>
        <div class="field-password">
            <input id="id_new_password2" name="new_password2" type="password"
                   class="field-input" autocomplete="new-password" required>
            <button type="button" class="field-eye"
                    data-pwd-toggle="id_new_password2" aria-label="Show password">
                <i class="bi bi-eye"></i>
            </button>
        </div>
    </div>

    <button type="submit" class="btn btn-primary btn-auth">Change password</button>
</form>
{% endblock %}
