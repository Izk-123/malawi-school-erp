{% extends "registration/_auth_page.html" %}
{% load crispy_forms_tags %}
{% block auth_content %}
<h4 class="fw-bold mb-3" style="color:#1a5632;">Change Password</h4>
<form method="post">{% csrf_token %}{{ form|crispy }}
<button class="btn btn-primary w-100 mt-2" type="submit">Change Password</button>
</form>
{% endblock %}
