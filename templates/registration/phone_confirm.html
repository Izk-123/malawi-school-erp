{% extends "registration/base_auth.html" %}
{% block title %}Enter verification code{% endblock %}

{% block content %}
<div class="auth-steps" role="progressbar" aria-valuenow="2" aria-valuemin="1" aria-valuemax="3">
    <span class="auth-step completed"><i class="bi bi-check"></i></span>
    <span class="auth-step-line completed"></span>
    <span class="auth-step active">2</span>
    <span class="auth-step-line"></span>
    <span class="auth-step">3</span>
</div>

<div class="auth-state">
    <div class="auth-state-icon"><i class="bi bi-shield-lock"></i></div>
    <h1 class="auth-state-title">Enter the 6-digit code</h1>
    <p class="auth-state-body">
        Sent to <strong>{{ phone_number }}</strong>
    </p>

    {% if error %}
    <div class="alert alert-danger" role="alert" style="width:100%;">
        <i class="bi bi-exclamation-triangle"></i> {{ error }}
    </div>
    {% endif %}

    <form method="post" class="otp-form" autocomplete="off" style="margin-top:12px;">
        {% csrf_token %}
        <input type="hidden" name="phone" value="{{ phone_number }}">
        <div class="otp-inputs" role="group" aria-label="6-digit verification code">
            <input class="otp-digit" type="text" inputmode="numeric" maxlength="1" pattern="[0-9]" aria-label="Digit 1" autofocus>
            <input class="otp-digit" type="text" inputmode="numeric" maxlength="1" pattern="[0-9]" aria-label="Digit 2">
            <input class="otp-digit" type="text" inputmode="numeric" maxlength="1" pattern="[0-9]" aria-label="Digit 3">
            <input class="otp-digit" type="text" inputmode="numeric" maxlength="1" pattern="[0-9]" aria-label="Digit 4">
            <input class="otp-digit" type="text" inputmode="numeric" maxlength="1" pattern="[0-9]" aria-label="Digit 5">
            <input class="otp-digit" type="text" inputmode="numeric" maxlength="1" pattern="[0-9]" aria-label="Digit 6">
        </div>
        <button type="submit" class="btn btn-primary btn-auth">Verify</button>
    </form>

    <div class="otp-resend" data-resend-seconds="60">
        Didn't get it?
        <form method="post" action="{% url 'accounts:phone_request' %}" style="display:inline;">
            {% csrf_token %}
            <input type="hidden" name="phone" value="{{ phone_number }}">
            <button type="submit" id="resendBtn" disabled>
                Resend code (<span id="countdown">01:00</span>)
            </button>
        </form>
    </div>
</div>
{% endblock %}
