{% extends "registration/base_auth.html" %}
{% block title %}Password reset{% endblock %}

{% block content %}
<div class="auth-state">
    <div class="auth-state-icon success"><i class="bi bi-check-circle"></i></div>
    <h1 class="auth-state-title">Password reset</h1>
    <p class="auth-state-body">
        Your password has been reset. You can now log in with your new password.
    </p>
    <a href="{% url 'accounts:login' %}" class="btn btn-primary btn-auth">Log in</a>
</div>
{% endblock %}
