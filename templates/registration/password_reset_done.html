{% extends "registration/base_auth.html" %}
{% block title %}Check your email{% endblock %}

{% block content %}

<div class="auth-state"
     data-motion-orchestrate='{"staggerChildren":0.08,"delayChildren":0.05}'>

    <div class="auth-state-icon success"
         data-motion-variant="brandMark"
         data-motion-initial="hidden"
         data-motion-animate="visible">
        <i class="bi bi-envelope-check"></i>
    </div>

    <h1 class="auth-state-title"
        data-reveal-text data-reveal-delay="140" data-reveal-stagger="22">
        Check your email
    </h1>

    <p class="auth-state-body" data-motion="fade-up" data-motion-delay="220">
        If an account exists for that email address, we've sent instructions
        to reset your password. The link expires in <strong>1 hour</strong>.
    </p>

    <a href="{% url 'accounts:login' %}" class="btn btn-outline btn-auth"
       data-motion="fade-up" data-motion-delay="300"
       data-motion-while-hover='{"y":-2}'
       data-motion-while-tap='{"scale":0.97}'
       data-ripple>
        Back to login
    </a>
</div>
{% endblock %}
