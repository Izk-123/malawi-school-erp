{% extends "registration/base_auth.html" %}
{% block title %}Check your email{% endblock %}

{% block content %}
<div class="auth-state">
    <div class="auth-state-icon success"><i class="bi bi-envelope-check"></i></div>
    <h1 class="auth-state-title">Check your email</h1>
    <p class="auth-state-body">
        If an account exists for that email address, we've sent instructions
        to reset your password. The link expires in <strong>1 hour</strong>.
    </p>
    <a href="{% url 'accounts:login' %}" class="btn btn-outline btn-auth">
        Back to login
    </a>
</div>
{% endblock %}
