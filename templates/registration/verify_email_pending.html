{% extends "registration/base_auth.html" %}
{% block title %}Check your email{% endblock %}

{% block content %}
<div class="auth-steps" role="progressbar" aria-valuenow="1" aria-valuemin="1" aria-valuemax="3">
    <span class="auth-step active">1</span>
    <span class="auth-step-line"></span>
    <span class="auth-step">2</span>
    <span class="auth-step-line"></span>
    <span class="auth-step">3</span>
</div>

<div class="auth-state">
    <div class="auth-state-icon"><i class="bi bi-envelope-check"></i></div>
    <h1 class="auth-state-title">Check your email</h1>
    <p class="auth-state-body">
        We've sent a verification link to<br>
        <strong>{{ user.email|default:"your email" }}</strong>.<br>
        The link expires in 24 hours.
    </p>

    <form method="post" action="{% url 'accounts:resend_email' %}" class="auth-state-actions">
        {% csrf_token %}
        <button type="submit" class="btn btn-primary btn-auth">
            Resend verification email
        </button>
    </form>

    <div class="auth-state-help">
        Wrong email? <a href="{% url 'accounts:profile' %}">Update it</a>
    </div>
</div>
{% endblock %}
