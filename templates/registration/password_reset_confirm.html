{% extends "registration/_auth_page.html" %}
{% load crispy_forms_tags %}
{% block auth_content %}
<h4 class="fw-bold mb-3" style="color:#1a5632;">Set a New Password</h4>
{% if validlink %}
<form method="post">{% csrf_token %}{{ form|crispy }}
<button class="btn btn-primary w-100 mt-2" type="submit">Set Password</button>
</form>
{% else %}
<div class="alert alert-danger">This reset link is invalid or has expired. Please request a new one.</div>
<a class="btn btn-outline-secondary w-100" href="{% url 'accounts:password_reset' %}">Request New Link</a>
{% endif %}
{% endblock %}
