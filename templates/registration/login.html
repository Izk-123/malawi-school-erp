{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Malawi School ERP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/custom.css' %}">
</head>
<body>
<div class="login-container">
    <div class="login-card">
        <div class="text-center mb-4">
            <div class="rounded-circle bg-primary d-inline-flex align-items-center justify-content-center" style="width:64px;height:64px;">
                <i class="bi bi-mortarboard-fill text-white fs-2"></i>
            </div>
            <h4 class="mt-3 fw-bold" style="color:#1a5632;">Malawi School ERP</h4>
            <p class="text-secondary">Maphunziro Athu &bull; Our Education</p>
        </div>
        {% if form.non_field_errors %}
        <div class="alert alert-danger">{{ form.non_field_errors.0 }}</div>
        {% endif %}
        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label fw-semibold">Username</label>
                <input type="text" name="username" class="form-control" required autofocus>
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold">Password</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold">Role</label>
                <select name="role" class="form-select">
                    {% for value, label in form.fields.role.choices %}
                    <option value="{{ value }}">{{ label }}</option>
                    {% endfor %}
                </select>
            </div>
            <input type="hidden" name="next" value="{{ next }}">
            <button type="submit" class="btn btn-primary w-100 py-2">Login <i class="bi bi-arrow-right ms-1"></i></button>
        </form>
        <div class="d-flex justify-content-between mt-3">
            <a href="{% url 'accounts:password_reset' %}" class="small">Forgot password?</a>
            <a href="{% url 'accounts:signup' %}" class="small">Create an account</a>
        </div>
    </div>
</div>
</body>
</html>
