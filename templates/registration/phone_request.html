{% extends "registration/base_auth.html" %}
{% block title %}Verify your phone{% endblock %}

{% block content %}
<div class="auth-steps" role="progressbar" aria-valuenow="2" aria-valuemin="1" aria-valuemax="3">
    <span class="auth-step completed"><i class="bi bi-check"></i></span>
    <span class="auth-step-line completed"></span>
    <span class="auth-step active">2</span>
    <span class="auth-step-line"></span>
    <span class="auth-step">3</span>
</div>

<div class="auth-state">
    <div class="auth-state-icon"><i class="bi bi-phone"></i></div>
    <h1 class="auth-state-title">Verify your phone</h1>
    <p class="auth-state-body">
        We'll send a 6-digit code by SMS to confirm your number.
    </p>

    {% if error %}
    <div class="alert alert-danger" role="alert" style="width:100%;">
        <i class="bi bi-exclamation-triangle"></i> {{ error }}
    </div>
    {% endif %}

    <form method="post" class="auth-form" style="width:100%;text-align:left;margin-top:12px;">
        {% csrf_token %}
        <div class="field">
            <label class="field-label" for="id_phone">Phone number</label>
            <div class="field-phone">
                <span class="field-prefix">+265</span>
                <input id="id_phone" name="phone" type="tel" class="field-input"
                       inputmode="numeric" pattern="[0-9]{9}" maxlength="9"
                       placeholder="991234567" autofocus required
                       value="{{ prefill_phone|default:'' }}">
            </div>
            <p class="field-help">Standard SMS rates apply.</p>
        </div>
        <button type="submit" class="btn btn-primary btn-auth">Send code</button>
    </form>
</div>
{% endblock %}
