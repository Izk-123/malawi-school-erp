{% extends "registration/base_auth.html" %}

{% block title %}Verify your phone{% endblock %}

{% block content %}

<div class="auth-steps"
     role="progressbar"
     aria-valuenow="2" aria-valuemin="1" aria-valuemax="3"
     data-motion-orchestrate='{"staggerChildren":0.06,"delayChildren":0.05}'>
    <span class="auth-step completed" data-motion="pop">
        <i class="bi bi-check"></i>
    </span>
    <span class="auth-step-line completed" data-motion="fade-in"></span>
    <span class="auth-step active" data-motion="pop" data-motion-delay="80">2</span>
    <span class="auth-step-line" data-motion="fade-in" data-motion-delay="140"></span>
    <span class="auth-step" data-motion="pop" data-motion-delay="200">3</span>
</div>

<div class="auth-state">

    <div class="auth-state-icon"
         data-motion-variant="brandMark"
         data-motion-initial="hidden"
         data-motion-animate="visible"
         data-motion-delay="80">
        <i class="bi bi-phone"></i>
    </div>

    <h1 class="auth-state-title"
        data-reveal-text data-reveal-delay="160" data-reveal-stagger="22">
        Verify your phone
    </h1>

    <p class="auth-state-body" data-motion="fade-up" data-motion-delay="240">
        We'll send a 6-digit code by SMS to confirm your number.
    </p>

    {% if error %}
    <div class="alert alert-danger"
         role="alert"
         style="width:100%;"
         data-motion-variant="shakingError"
         data-motion-initial="hidden"
         data-motion-animate="visible"
         data-motion-delay="280">
        <i class="bi bi-exclamation-triangle"></i> {{ error }}
    </div>
    {% endif %}

    <form method="post" class="auth-form"
          style="width:100%;text-align:left;margin-top:12px;"
          data-motion-orchestrate='{"staggerChildren":0.06,"delayChildren":0.05}'>

        {% csrf_token %}

        <div class="field" data-motion="fade-up">
            <label class="field-label" for="id_phone">Phone number</label>
            <div class="field-phone">
                <span class="field-prefix">+265</span>
                <input id="id_phone" name="phone" type="tel" class="field-input"
                       inputmode="numeric" pattern="[0-9]{9}" maxlength="9"
                       placeholder="991234567" autofocus required
                       value="{{ prefill_phone|default:'' }}">
            </div>
            <p class="field-help">Standard SMS rates apply.</p>
        </div>

        <button type="submit" class="btn btn-primary btn-auth"
                data-motion="fade-up"
                data-motion-while-hover='{"y":-2,"scale":1.01}'
                data-motion-while-tap='{"scale":0.97}'
                data-ripple>
            Send code
        </button>
    </form>
</div>
{% endblock %}
