{% extends "registration/_auth_page.html" %}
{% load crispy_forms_tags %}
{% block auth_content %}
<h4 class="fw-bold mb-3" style="color:#1a5632;">Reset Password</h4>
<p class="text-secondary small">Enter your email and we'll send you a link to reset your password.</p>
<form method="post">{% csrf_token %}{{ form|crispy }}
<button class="btn btn-primary w-100 mt-2" type="submit">Send Reset Link</button>
</form>
<p class="text-center mt-3 small"><a href="{% url 'accounts:login' %}">Back to login</a></p>
{% endblock %}
