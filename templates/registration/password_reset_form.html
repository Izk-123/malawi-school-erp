{% extends "registration/base_auth.html" %}
{% block title %}Reset password{% endblock %}

{% block content %}
<div class="auth-state">
    <div class="auth-state-icon"><i class="bi bi-key"></i></div>
    <h1 class="auth-state-title">Reset your password</h1>
    <p class="auth-state-body">
        Enter your email and we'll send you a link to set a new password.
    </p>

    <form method="post" class="auth-form" style="width:100%;text-align:left;">
        {% csrf_token %}
        <div class="field">
            <label class="field-label" for="id_email">Email</label>
            <input id="id_email" name="email" type="email" class="field-input"
                   autocomplete="email" inputmode="email" autofocus required>
        </div>
        <button type="submit" class="btn btn-primary btn-auth">Send reset link</button>
    </form>

    <div class="auth-state-help">
        <a href="{% url 'accounts:login' %}">Back to login</a>
    </div>
</div>
{% endblock %}
