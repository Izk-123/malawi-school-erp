{% extends "registration/base_auth.html" %}
{% block title %}Reset password{% endblock %}

{% block content %}

<div class="auth-state"
     data-motion-orchestrate='{"staggerChildren":0.08,"delayChildren":0.05}'>

    <div class="auth-state-icon"
         data-motion-variant="brandMark"
         data-motion-initial="hidden"
         data-motion-animate="visible">
        <i class="bi bi-key"></i>
    </div>

    <h1 class="auth-state-title"
        data-reveal-text data-reveal-delay="140" data-reveal-stagger="22">
        Reset your password
    </h1>

    <p class="auth-state-body" data-motion="fade-up" data-motion-delay="220">
        Enter your email and we'll send you a link to set a new password.
    </p>
</div>

<form method="post" class="auth-form"
      style="width:100%;text-align:left;"
      data-motion-orchestrate='{"staggerChildren":0.06,"delayChildren":0.05}'>

    {% csrf_token %}

    <div class="field" data-motion="fade-up">
        <label class="field-label" for="id_email">Email</label>
        <input id="id_email" name="email" type="email" class="field-input"
               autocomplete="email" inputmode="email" autofocus required>
    </div>

    <button type="submit" class="btn btn-primary btn-auth"
            data-motion="fade-up"
            data-motion-while-hover='{"y":-2,"scale":1.01}'
            data-motion-while-tap='{"scale":0.97}'
            data-ripple>
        Send reset link
    </button>
</form>

<div class="auth-state-help"
     style="text-align:center;margin-top:12px;"
     data-motion="fade-in" data-motion-delay="280">
    <a href="{% url 'accounts:login' %}">Back to login</a>
</div>
{% endblock %}
