{% extends "registration/base_auth.html" %}
{% block title %}Password changed{% endblock %}

{% block content %}
<div class="auth-state">
    <div class="auth-state-icon success"><i class="bi bi-check-circle"></i></div>
    <h1 class="auth-state-title">Password changed</h1>
    <p class="auth-state-body">Your password has been updated successfully.</p>
    <a href="{% url 'accounts:dashboard' %}" class="btn btn-primary btn-auth">Go to dashboard</a>
</div>
{% endblock %}
