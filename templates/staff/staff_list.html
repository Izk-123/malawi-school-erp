{% extends "base.html" %}
{% block page_title %}Staff Directory{% endblock %}
{% block content %}
<div class="card"><div class="card-header"><h5 class="mb-0 fw-bold">Staff Directory</h5></div>
<div class="card-body p-0"><table class="table table-hover mb-0">
<thead><tr><th>ID</th><th>Name</th><th>Position</th><th>Department</th><th>Phone</th></tr></thead>
<tbody>{% for s in staff_members %}<tr><td>{{ s.staff_id }}</td><td>{{ s.full_name }}</td><td>{{ s.position }}</td><td>{{ s.department }}</td><td>{{ s.phone_number }}</td></tr>{% endfor %}</tbody>
</table></div></div>
{% endblock %}
