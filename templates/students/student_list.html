{% extends "base.html" %}
{% block page_title %}Student Management{% endblock %}
{% block content %}
<div class="card">
    <div class="card-header d-flex justify-content-between flex-wrap gap-2">
        <h5 class="mb-0 fw-bold">Student List ({{ table.paginator.count }})</h5>
        <div class="d-flex gap-2 flex-wrap">
            <form class="d-flex gap-2 flex-wrap" method="get">
                <input type="text" name="q" class="form-control form-control-sm" placeholder="Search name/ID/guardian..." value="{{ request.GET.q }}">
                <select name="class_name" class="form-select form-select-sm" style="width:120px;">
                    <option value="">All Classes</option>
                    {% for c in "1234" %}<option value="Form {{ c }}" {% if request.GET.class_name == "Form "|add:c %}selected{% endif %}>Form {{ c }}</option>{% endfor %}
                </select>
                <select name="status" class="form-select form-select-sm" style="width:120px;">
                    <option value="">All Status</option>
                    {% for value, label in filter.form.status.field.choices %}<option value="{{ value }}" {% if request.GET.status == value %}selected{% endif %}>{{ label }}</option>{% endfor %}
                </select>
                <button class="btn btn-sm btn-outline-secondary" type="submit"><i class="bi bi-search"></i></button>
            </form>
            {% if current_role == 'admin' %}
            <a href="{% url 'students:promote' %}" class="btn btn-outline-primary btn-sm"><i class="bi bi-arrow-up-circle me-1"></i>Promote</a>
            <a href="{% url 'reports:export_csv' %}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-download me-1"></i>Export CSV</a>
            <a href="{% url 'students:create' %}" class="btn btn-primary btn-sm"><i class="bi bi-plus-circle me-1"></i>Add Student</a>
            {% endif %}
        </div>
    </div>
    <div class="card-body p-0">{% load django_tables2 %}{% render_table table %}</div>
</div>
{% endblock %}
